<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123d2c" />
    <title>Admin | Our Christmas Story</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #102b22;
        color: #f8f0df;
      }

      button,
      input {
        font: inherit;
      }

      .container {
        width: min(100% - 32px, 950px);
        margin: auto;
        padding: 35px 0;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 30px;
      }

      h1 {
        margin: 0;
        font-family: Georgia, serif;
        color: #e9c77b;
      }

      .subtitle {
        color: #c6cbbf;
        font-size: 14px;
        margin-top: 8px;
      }

      .panel {
        background: #193c30;
        border: 1px solid #42604d;
        border-radius: 18px;
        padding: 25px;
        margin-bottom: 22px;
      }

      .login-panel {
        max-width: 420px;
        margin: 70px auto;
      }

      h2 {
        margin-top: 0;
        color: #e9c77b;
        font-family: Georgia, serif;
      }

      label {
        display: block;
        margin: 16px 0 8px;
        font-size: 14px;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 13px;
        border-radius: 9px;
        border: 1px solid #71816f;
        background: #102b22;
        color: white;
        outline: none;
      }

      input:focus {
        border-color: #e9c77b;
      }

      button {
        border: none;
        border-radius: 9px;
        padding: 12px 18px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
      }

      button:hover {
        opacity: 0.85;
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .primary {
        background: #d7b66d;
        color: #183528;
      }

      .danger {
        background: #8f3038;
        color: white;
      }

      .secondary {
        background: #345747;
        color: white;
      }

      .full {
        width: 100%;
        margin-top: 20px;
      }

      .hidden {
        display: none !important;
      }

      .upload-area {
        border: 2px dashed #8b9c7d;
        border-radius: 14px;
        padding: 35px 15px;
        text-align: center;
        background: #143529;
      }

      .upload-icon {
        font-size: 42px;
        margin-bottom: 10px;
      }

      .upload-area p {
        color: #c6cbbf;
        font-size: 14px;
      }

      .file-input {
        display: none;
      }

      .file-label {
        display: inline-block;
        padding: 12px 20px;
        background: #d7b66d;
        color: #183528;
        border-radius: 9px;
        font-weight: bold;
        cursor: pointer;
      }

      .selected-files {
        margin-top: 15px;
        color: #e9c77b;
        font-size: 14px;
        overflow-wrap: anywhere;
      }

      .status {
        margin-top: 15px;
        font-size: 14px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
        gap: 15px;
      }

      .photo-card {
        background: #102b22;
        border: 1px solid #526c55;
        border-radius: 12px;
        overflow: hidden;
      }

      .photo-card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        display: block;
      }

      .photo-info {
        padding: 10px;
      }

      .photo-name {
        font-size: 12px;
        color: #d5d5c7;
        overflow-wrap: anywhere;
        margin-bottom: 10px;
      }

      .delete-btn {
        width: 100%;
        padding: 8px;
        font-size: 12px;
      }

      .empty {
        text-align: center;
        color: #c6cbbf;
        padding: 30px 10px;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .count {
        color: #e9c77b;
        font-size: 14px;
        margin-bottom: 18px;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <!-- LOGIN -->
      <section id="loginSection" class="panel login-panel">
        <h1>🎄 Admin Login</h1>
        <p class="subtitle">Our Christmas Story</p>

        <form id="loginForm">
          <label for="email">อีเมลผู้ดูแลระบบ</label>
          <input
            type="email"
            id="email"
            placeholder="Admin email"
            autocomplete="username"
            required
          />

          <label for="password">รหัสผ่าน</label>
          <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />

          <button class="primary full" type="submit" id="loginBtn">
            เข้าสู่ระบบ
          </button>
        </form>

        <div class="status" id="loginStatus"></div>
      </section>

      <!-- DASHBOARD -->
      <section id="dashboard" class="hidden">
        <div class="header">
          <div>
            <h1>🎄 Admin Dashboard</h1>
            <p class="subtitle">จัดการรูปภาพความทรงจำของเรา</p>
          </div>

          <div class="top-actions">
            <button class="secondary" id="refreshBtn">↻ รีเฟรช</button>
            <button class="danger" id="logoutBtn">ออกจากระบบ</button>
          </div>
        </div>

        <!-- UPLOAD -->
        <div class="panel">
          <h2>📸 เพิ่มรูปภาพ</h2>
          <p class="subtitle">
            เลือกรูปภาพจากอุปกรณ์ของคุณเพื่อเพิ่มลงในแกลเลอรี
          </p>

          <div class="upload-area">
            <div class="upload-icon">🖼️</div>

            <p>เลือกรูปภาพที่ต้องการเพิ่ม</p>

            <label for="photoInput" class="file-label"> + เลือกรูปภาพ </label>

            <input
              type="file"
              id="photoInput"
              class="file-input"
              accept="image/jpeg,image/png,image/webp,image/gif"
              multiple
            />

            <div class="selected-files" id="selectedFiles">
              ยังไม่ได้เลือกรูปภาพ
            </div>
          </div>

          <button class="primary full" id="uploadBtn" disabled>
            อัปโหลดรูปภาพ
          </button>

          <div class="status" id="uploadStatus"></div>
        </div>

        <!-- GALLERY -->
        <div class="panel">
          <h2>🖼️ รูปภาพทั้งหมด</h2>

          <div class="count" id="photoCount">กำลังโหลด...</div>

          <div class="gallery-grid" id="galleryGrid"></div>
        </div>
      </section>
    </main>

    <script>
      const SUPABASE_URL = "https://kguzadlezbkdwikbbstr.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_AuczKzsEUi81Mmjmnqah0w_Pphu49bz";
      const BUCKET = "gallery-photos";

      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const loginSection = document.getElementById("loginSection");
      const dashboard = document.getElementById("dashboard");
      const loginForm = document.getElementById("loginForm");
      const loginBtn = document.getElementById("loginBtn");
      const loginStatus = document.getElementById("loginStatus");

      const photoInput = document.getElementById("photoInput");
      const selectedFiles = document.getElementById("selectedFiles");
      const uploadBtn = document.getElementById("uploadBtn");
      const uploadStatus = document.getElementById("uploadStatus");

      const galleryGrid = document.getElementById("galleryGrid");
      const photoCount = document.getElementById("photoCount");

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        loginBtn.disabled = true;
        loginStatus.textContent = "กำลังเข้าสู่ระบบ...";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { data, error } = await db.auth.signInWithPassword({
          email,
          password,
        });

        loginBtn.disabled = false;

        if (error) {
          loginStatus.textContent = "เข้าสู่ระบบไม่สำเร็จ: " + error.message;
          return;
        }

        loginStatus.textContent = "";
        showDashboard(data.user);
      });

      function showDashboard(user) {
        if (!user) return;
        loginSection.classList.add("hidden");
        dashboard.classList.remove("hidden");
        loadGallery();
      }

      document.getElementById("logoutBtn").addEventListener("click", async () => {
        await db.auth.signOut();
        dashboard.classList.add("hidden");
        loginSection.classList.remove("hidden");
        loginForm.reset();
      });

      photoInput.addEventListener("change", () => {
        const files = Array.from(photoInput.files || []);
        if (files.length === 0) {
          selectedFiles.textContent = "ยังไม่ได้เลือกรูปภาพ";
          uploadBtn.disabled = true;
          return;
        }
        selectedFiles.textContent = "เลือกรูปภาพแล้ว " + files.length + " รูป";
        uploadBtn.disabled = false;
      });

      uploadBtn.addEventListener("click", async () => {
        const files = Array.from(photoInput.files || []);
        if (!files.length) return;

        uploadBtn.disabled = true;
        let success = 0;
        let failed = 0;

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          uploadStatus.textContent = `กำลังอัปโหลด ${i + 1}/${files.length}: ${file.name}`;

          if (!file.type.startsWith("image/")) {
            failed++;
            continue;
          }

          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          const path = Date.now() + "-" + crypto.randomUUID() + "-" + safeName;

          const { error: uploadError } = await db.storage
            .from(BUCKET)
            .upload(path, file, {
              cacheControl: "3600",
              upsert: false,
              contentType: file.type,
            });

          if (uploadError) {
            failed++;
            continue;
          }

          const { error: insertError } = await db
            .from("gallery_photos")
            .insert({
              file_name: file.name,
              storage_path: path,
            });

          if (insertError) {
            await db.storage.from(BUCKET).remove([path]);
            failed++;
            continue;
          }

          success++;
        }

        uploadStatus.textContent = `เสร็จแล้ว! เพิ่มสำเร็จ ${success} รูป และไม่สำเร็จ ${failed} รูป`;
        photoInput.value = "";
        selectedFiles.textContent = "ยังไม่ได้เลือกรูปภาพ";
        await loadGallery();
        uploadBtn.disabled = true;
      });

      async function loadGallery() {
        galleryGrid.innerHTML = '<div class="empty">กำลังโหลดรูปภาพ...</div>';

        const { data, error } = await db
          .from("gallery_photos")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          galleryGrid.innerHTML = "";
          photoCount.textContent = "โหลดรูปภาพไม่สำเร็จ";
          return;
        }

        photoCount.textContent = "รูปภาพทั้งหมด " + data.length + " รูป";
        galleryGrid.innerHTML = "";

        if (data.length === 0) {
          galleryGrid.innerHTML = '<div class="empty">ยังไม่มีรูปภาพในแกลเลอรี</div>';
          return;
        }

        data.forEach((photo) => {
          const { data: imageData } = db.storage
            .from(BUCKET)
            .getPublicUrl(photo.storage_path);

          const card = document.createElement("div");
          card.className = "photo-card";

          const img = document.createElement("img");
          img.src = imageData.publicUrl;
          img.alt = photo.file_name || "Gallery photo";
          img.loading = "lazy";

          const info = document.createElement("div");
          info.className = "photo-info";

          const name = document.createElement("div");
          name.className = "photo-name";
          name.textContent = photo.file_name;

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "danger delete-btn";
          deleteBtn.textContent = "ลบรูปภาพ";

          deleteBtn.addEventListener("click", () => {
            deletePhoto(photo.id, photo.storage_path);
          });

          info.appendChild(name);
          info.appendChild(deleteBtn);
          card.appendChild(img);
          card.appendChild(info);
          galleryGrid.appendChild(card);
        });
      }

      async function deletePhoto(id, path) {
        if (!confirm("คุณต้องการลบรูปภาพนี้ใช่หรือไม่?")) return;

        const { error: storageError } = await db.storage
          .from(BUCKET)
          .remove([path]);

        if (storageError) {
          alert("ลบไฟล์รูปภาพไม่สำเร็จ: " + storageError.message);
          return;
        }

        const { error: databaseError } = await db
          .from("gallery_photos")
          .delete()
          .eq("id", id);

        if (databaseError) {
          alert("ลบข้อมูลไม่สำเร็จ: " + databaseError.message);
          return;
        }

        alert("ลบรูปภาพเรียบร้อยแล้ว");
        await loadGallery();
      }

      document.getElementById("refreshBtn").addEventListener("click", loadGallery);

      async function initialize() {
        const { data } = await db.auth.getSession();
        if (data.session) {
          showDashboard(data.session.user);
        }
      }

      initialize();
    </script>
  </body>
</html>
